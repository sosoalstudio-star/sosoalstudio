<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="N7r0pG_QqgvaTG1ZTQbAzjVNX8pvMbZ4yy1qPd2xd4w" />
    <title>sosoalstudio - استوديو الأزياء الفاخر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* --- CSS Variables & Reset --- */
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2c2c2c;
            --accent-color: #c5a059;
            --accent-hover: #a8843e;
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-light: #666666;
            --danger-color: #d9534f;
            --success-color: #28a745;
            --border-radius: 10px;
            --shadow: 0 5px 15px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
            --border-width: 1.5px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            border-top: 4px solid var(--accent-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* --- Header & Nav --- */
        header {
            background-color: var(--card-bg);
            border-bottom: var(--border-width) solid var(--accent-color);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-svg {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 0.5px;
        }

        .logo-text span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            padding: 5px 0;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-icon {
            color: var(--primary-color);
            font-size: 1.2rem;
            transition: var(--transition);
            text-decoration: none;
            border: 1px solid var(--accent-color);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .social-icon:hover {
            background-color: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn {
            padding: 8px 18px;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: 1.5px solid var(--accent-color);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-gold {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-gold:hover {
            background-color: var(--accent-hover);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--primary-color);
            cursor: pointer;
        }

        /* --- Hero Section --- */
        .hero {
            min-height: 75vh;
            background: linear-gradient(rgba(26, 26, 26, 0.7), rgba(26, 26, 26, 0.7)), url('https://picsum.photos') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #ffffff;
            margin: 20px auto 50px;
            border: 2px solid var(--accent-color);
            border-radius: var(--border-radius);
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .hero h1 span {
            color: var(--accent-color);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .btn-cta {
            background-color: var(--accent-color);
            color: white;
            padding: 14px 38px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: var(--transition);
            display: inline-block;
            border: 2px solid var(--accent-color);
        }

        .btn-cta:hover {
            background-color: transparent;
            color: var(--accent-color);
            transform: translateY(-3px);
        }

        /* --- Gallery Section --- */
        .section-padding {
            padding: 50px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
            font-size: 2.2rem;
            color: var(--primary-color);
            font-weight: 800;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 70px;
            height: 4px;
            background-color: var(--accent-color);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 1.5px solid var(--accent-color);
            padding: 8px 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--primary-color);
            font-weight: 700;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 25px;
        }

        .fashion-card {
            background-color: var(--card-bg);
            border: var(--border-width) solid var(--accent-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .fashion-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .card-img-container {
            height: 320px;
            overflow: hidden;
            position: relative;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .fashion-card:hover .card-img-container img {
            transform: scale(1.08);
        }

        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--primary-color);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--accent-color);
        }

        .card-details {
            padding: 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: 700;
        }

        .card-price {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .card-desc {
